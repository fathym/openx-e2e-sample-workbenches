# Test fixtures for OpenX e2e. Not for use.
#
# Checks the three workspace members on every branch push and pull request, and publishes them to
# JSR (through GitHub OIDC) only from `main`, each at the exact version its own deno.jsonc names.
# Not fathym/build-n-publish like the sibling sample repos: that action computes one version from the
# commit history, bumps it on every commit, suffixes other branches (x.y.z-<branch>) and edits only
# the root deno.jsonc. These fixtures are three packages in one workspace that the e2e journeys pin
# at an exact 0.0.1, so a computed version would break the pin. A version already on JSR is skipped,
# so a later push to main publishes nothing until a member's version moves.
name: Publish

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main, integration]
  pull_request:
    branches: [main, integration]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deno Setup
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build
        run: deno task build

      - name: Publish check
        if: github.ref != 'refs/heads/main'
        run: deno task publish:check

      - name: Publish
        if: github.ref == 'refs/heads/main'
        run: deno publish
